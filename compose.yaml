name: dataops-demo-app

services:
  gateway:
    image: caddy:2.10.2-alpine
    user: "10001:10001"
    read_only: true
    ports:
      - "80:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /config
      - /data
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE}
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - frontend
    restart: unless-stopped

  api:
    image: ${API_IMAGE:?set API_IMAGE}
    environment:
      APP_REVISION: ${APP_REVISION:?set APP_REVISION}
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - backend
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true
