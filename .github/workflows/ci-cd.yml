name: CI/CD with DataOps telemetry

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Emit a controlled failed run for the DataOps demo
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: dataops-demo-production
  cancel-in-progress: false

jobs:
  test-build-deploy:
    runs-on: [self-hosted, linux, x64, dataops-demo]
    timeout-minutes: 30
    env:
      DATAOPS_URL: http://127.0.0.1:18080
      IMAGE_PREFIX: ghcr.io/andyanh174/dataops-demo

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report pipeline start to DataOps
        run: ./scripts/report-dataops.sh RUNNING pipeline.started

      - name: Test FastAPI image
        run: docker build --target test --tag dataops-demo-api:test ./backend

      - name: Test Next.js image
        run: docker build --target test --tag dataops-demo-web:test ./frontend

      - name: Simulate a controlled failure
        if: ${{ inputs.simulate_failure == true }}
        run: |
          echo "Intentional demo failure requested."
          exit 42

      - name: Build immutable release images
        run: |
          docker build --target runtime --tag "${IMAGE_PREFIX}-api:sha-${GITHUB_SHA}" ./backend
          docker build --target runtime --tag "${IMAGE_PREFIX}-web:sha-${GITHUB_SHA}" ./frontend

      - name: Scan release images for critical vulnerabilities
        run: |
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image --exit-code 1 --severity CRITICAL --ignore-unfixed \
            "${IMAGE_PREFIX}-api:sha-${GITHUB_SHA}"
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image --exit-code 1 --severity CRITICAL --ignore-unfixed \
            "${IMAGE_PREFIX}-web:sha-${GITHUB_SHA}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable release images
        run: |
          docker push "${IMAGE_PREFIX}-api:sha-${GITHUB_SHA}"
          docker push "${IMAGE_PREFIX}-web:sha-${GITHUB_SHA}"

      - name: Deploy with automatic rollback
        run: |
          ./deploy/deploy.sh \
            "${IMAGE_PREFIX}-web:sha-${GITHUB_SHA}" \
            "${IMAGE_PREFIX}-api:sha-${GITHUB_SHA}" \
            "${GITHUB_SHA}"

      - name: Report final state to DataOps
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "${JOB_STATUS}" == "success" ]]; then
            ./scripts/report-dataops.sh SUCCESS pipeline.completed
          elif [[ "${JOB_STATUS}" == "cancelled" ]]; then
            ./scripts/report-dataops.sh CANCELED pipeline.completed ci-cd
          else
            ./scripts/report-dataops.sh FAILED pipeline.completed ci-cd
          fi
