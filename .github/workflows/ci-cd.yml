name: CI/CD with DataOps telemetry

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Emit a controlled failed run for the DataOps demo
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: dataops-demo-production
  cancel-in-progress: false

jobs:
  test-build-deploy:
    runs-on: [self-hosted, linux, x64, dataops-demo]
    timeout-minutes: 60
    env:
      DATAOPS_URL: http://127.0.0.1:18080
      IMAGE_PREFIX: ghcr.io/andyanh174/dataops-demo

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run pipeline through DataOps Agent
        uses: AndyAnh174/dataops-agent@v0
        env:
          DATAOPS_TOKEN: ${{ secrets.DATAOPS_TOKEN }}
          DATAOPS_SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
