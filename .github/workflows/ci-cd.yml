name: CI/CD with DataOps telemetry

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fault_scenario:
        description: Data-quality condition to inject into the Pandas dataset
        required: true
        type: choice
        default: none
        options:
          - none
          - schema_drift
          - null_rate
          - duplicate
          - range
          - volume

permissions:
  contents: read
  packages: write

concurrency:
  group: dataops-demo-production
  cancel-in-progress: false

jobs:
  test-build-deploy:
    runs-on: [self-hosted, linux, x64, dataops-demo]
    timeout-minutes: 60
    env:
      DATAOPS_URL: http://127.0.0.1:18080
      IMAGE_PREFIX: ghcr.io/andyanh174/dataops-demo

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run pipeline through DataOps Agent
        uses: AndyAnh174/dataops-agent@v0
        env:
          DATAOPS_TOKEN: ${{ secrets.DATAOPS_TOKEN }}
          DATAOPS_FAULT_SCENARIO: ${{ inputs.fault_scenario || 'none' }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
