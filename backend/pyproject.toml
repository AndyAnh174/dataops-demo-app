[project]
name = "dataops-demo-api"
version = "0.1.0"
description = "FastAPI service used to demonstrate the DataOps control plane"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
